name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build exe
        run: |
          python -m pip install -e ".[dev]"
          pyinstaller packaging/cadcraft-elec-mcp.spec --noconfirm --distpath dist --workpath build
          dist/cadcraft-elec-mcp.exe --version
      - name: Build wheel
        run: |
          python -m pip install build
          python -m build --wheel --outdir dist
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/cadcraft-elec-mcp.exe dist/*.whl --title "${{ github.ref_name }}" --notes-file CHANGELOG.md
