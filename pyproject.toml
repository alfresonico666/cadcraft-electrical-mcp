[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "cadcraft-elec-mcp"
version = "0.1.1"
description = "MCP server that generates industrial electrical drawings (IEC / NFPA schematics, cabinet layouts, networks, terminal plans) on top of CADCraft."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "Alfredo Castillo" }]
keywords = ["mcp", "cad", "dxf", "electrical", "iec-81346", "nfpa-79", "cadcraft", "automation"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: Microsoft :: Windows",
  "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
]
dependencies = [
  "mcp>=2.3,<3",
  "ezdxf>=1.4,<2",
  "pydantic>=2.12,<3",
  "pydantic-settings>=2.6,<3",
  "pyyaml>=6.0",
  "openpyxl>=3.1",
  "pypdf>=5.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.8", "mypy>=1.13", "types-PyYAML", "pyinstaller>=6.10"]

[project.scripts]
cadcraft-elec-mcp = "cadcraft_elec_mcp.__main__:main"

[project.urls]
Homepage = "https://github.com/alfresonico666/cadcraft-electrical-mcp"
Issues = "https://github.com/alfresonico666/cadcraft-electrical-mcp/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/cadcraft_elec_mcp"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "PL"]
ignore = [
  "PLR0913", "PLR0917", "PLR2004", "PLR0912", "PLR0915", "PLR0911",  # complexity: tool signatures mirror MCP schemas
  "PLC0415",                                                         # lazy imports keep startup fast / avoid cycles
  "RUF001", "RUF002", "RUF003",                                       # Spanish text and unicode symbols
]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E501"]   # long Markdown lines in generated docs

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
packages = ["cadcraft_elec_mcp"]
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["ezdxf", "ezdxf.*"]
implicit_reexport = true

[[tool.mypy.overrides]]
module = ["cadcraft_elec_mcp.domain.*", "cadcraft_elec_mcp.standards.*", "cadcraft_elec_mcp.validation.*"]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["integration: needs a local CADCraft installation (cadcraft-cli)"]
