# NFPA 79 profile: JIC/ANSI-style symbols (IEEE 315 / NFPA 79 Annex), device designations without
# prefix (CR1, M1, CB1, PB1 ...), horizontal ladder rungs with line numbers, NFPA 79 §13.2 colours.
extends: iec
name: nfpa
title: "NFPA 79 (ladder JIC/ANSI)"
symbol_style: nfpa
orientation: horizontal        # rungs run left -> right between vertical rails
numbering: line_reference
tag:
  prefix: ""
  scheme: "NFPA 79 Annex device designations"
  codes:
    contactor: M
    relay: CR
    safety_relay: SR
    timer_relay: TR
    mcb: CB
    mpcb: MPCB
    fuse: FU
    rcd: GFCI
    surge_protector: SPD
    main_switch: DISC
    overload: OL
    psu: PS
    transformer: T
    plc_cpu: PLC
    plc_module: PLC
    hmi: HMI
    network_switch: ENET
    iolink_master: IOL
    iolink_hub: IOL
    fieldbus_coupler: COM
    sensor: PRX
    pressure_sensor: PRS
    measuring_sensor: SEN
    safety_sensor: SLC
    solenoid_valve: SOL
    valve_manifold: SOL
    motor: MTR
    vfd: VFD
    pushbutton: PB
    estop: ES
    selector: SS
    pilot_lamp: LT
    terminal_strip: TB
    connector: CON
    service_port: CON
    fan: FAN
    cable: W
    pc: PC
    generic: U

sheet:
  paper: ANSI B         # 11x17 in (Tabloid)
  width: 431.8
  height: 279.4
  margin_left: 20
  margin_right: 10
  margin_top: 10
  margin_bottom: 10
  zone_band: 5
  columns: 2            # ladder: two rung bands per sheet
  rows: 6               # zone letters
  rungs: 10             # rungs (line numbers) per band (22 mm pitch on ANSI B)
  title_block_height: 30

wire_colors:            # NFPA 79 §13.2.4
  ac_phase:   {code: BLK, name: "Black (power)", aci: 7}
  ac_neutral: {code: WHT, name: "White (grounded conductor)", aci: 8}
  pe:         {code: GRN, name: "Green (equipment grounding)", aci: 3}
  ac_control: {code: RED, name: "Red (AC control)", aci: 1}
  dc_plus:    {code: BLU, name: "Blue (DC control)", aci: 5}
  dc_minus:   {code: WHT/BLU, name: "White w/ blue stripe (grounded DC)", aci: 5}
  external:   {code: ORG, name: "Orange/Yellow (externally fed)", aci: 30}

cross_sections_mm2:     # ~AWG 14 power, AWG 18 control
  ac_phase: 2.08
  ac_neutral: 2.08
  pe: 2.08
  ac_control: 0.82
  dc_plus: 0.82
  dc_minus: 0.82
  external: 0.82
